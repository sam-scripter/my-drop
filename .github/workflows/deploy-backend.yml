# deploy-backend.yml — Auto-deploy pipeline for the mydrop backend
#
# What this does on every push to main that touches the backend folder:
#   1. Builds a Docker image from backend/Dockerfile
#   2. Pushes the image to GitHub Container Registry (ghcr.io)
#   3. SSHes into the VPS and pulls + restarts the new image
#
# This means: git push = live deployment. No manual steps.

name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      # Only run this workflow when backend files change
      # A push that only changes web/ files won't trigger a backend redeploy
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # GitHub provides this machine for free

    steps:
      # Step 1: Check out the code so the workflow can read your files
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry
      # This is where your Docker image will be stored
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 3: Allows building for multiple CPU architectures
      # Your Oracle VPS uses ARM64, GitHub Actions runs on AMD64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 4: Required for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build the Docker image and push it to ghcr.io
      # Builds for both ARM64 (your VPS) and AMD64 (most other servers)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/backend:latest

      # Step 6: SSH into the VPS and restart the backend with the new image
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/mydrop/backend
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f