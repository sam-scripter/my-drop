# deploy-backend.yml — Auto-deploy pipeline for the mydrop backend
#
# What this does on every push to main that touches the backend folder:
#   1. Builds a Docker image from backend/Dockerfile
#   2. Pushes the image to GitHub Container Registry (ghcr.io)
#   3. SSHes into the VPS and pulls + restarts the new image
#
# This means: git push = live deployment. No manual steps.

name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      # Only run this workflow when backend files change
      # A push that only changes web/ files won't trigger a backend redeploy
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # GitHub provides this machine for free

    steps:
      # Step 1: Check out the code so the workflow can read your files
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry
      # This is where your Docker image will be stored
      # ghcr.io is free for private repos up to a generous storage limit
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 3: Build the Docker image and push it to ghcr.io
      # context: ./backend means Docker looks for the Dockerfile in /backend
      # The image will be tagged as:
      # ghcr.io/sam-scripter/my-drop/backend:latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      # Step 4: SSH into the VPS and restart the backend with the new image
      # This runs the commands below directly on your VPS as the ubuntu user
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Move into the backend project folder on the VPS
            cd ~/mydrop/backend

            # Log in to ghcr.io on the VPS so it can pull the new image
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the newly built image
            docker compose pull

            # Restart containers with the new image, no downtime for other containers
            docker compose up -d --remove-orphans

            # Remove old unused images to keep disk clean
            docker image prune -f